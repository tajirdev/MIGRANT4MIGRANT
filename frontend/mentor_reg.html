<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mentor Registration - MIGRANT4MIGRANT</title>
    <link href="style/output.css" rel="stylesheet">
    <link rel="preload" href="js/nav.js" as="script">
</head>
<body class="bg-split-layout min-h-screen flex items-center justify-center p-4 md:p-8 overflow-x-hidden font-sans antialiased">

    <div class="fixed inset-0 z-0">
        <img src="assets/background_form.jpg" 
             alt="Journey Silhouettes" 
             class="w-full h-full object-cover opacity-90 mix-blend-multiply">
        <div class="absolute top-0 left-0 w-full h-1/2 bg-gradient-to-b from-sunny-yellow/10 to-transparent"></div>
    </div>

    <main class="relative z-10 w-full max-w-6xl flex flex-col md:flex-row items-center justify-between gap-12">
        
        <div class="w-full md:w-1/2 text-center md:text-left space-y-4 pt-0 md:mt-[-26rem]">
            <svg style="position: absolute; width: 0; height: 0;" aria-hidden="true" focusable="false">
                <filter id="rough-edge">
                    <feTurbulence type="fractalNoise" baseFrequency="0.05" numOctaves="3" result="noise" />
                    <feDisplacementMap in="SourceGraphic" in2="noise" scale="8" />
                </filter>
            </svg>

            <h1 class="text-text-main text-5xl md:text-7xl font-black uppercase leading-none tracking-tighter">
                MIGRANT<span class="text-home-coral">4</span><br>MIGRANT
            </h1>

            <div class="brush-wrapper mx-auto md:mx-0">
                <div class="brush-stroke"></div>
                <p class="text-text-main text-lg font-bold leading-relaxed relative">
                    Because your experience is a roadmap for someone else.
                </p>
            </div>
        </div>

        <div class="w-full max-w-md">
            <div class="glass-card">
                <div class="mb-8">
                    <h2 class="text-2xl font-bold text-text-main">Be a Mentor</h2>
                    <p class="text-gray-500 text-sm">Guide the next generation with your story.</p>
                </div>

                <form id="mentorRegForm" class="space-y-5">
                    <div>
                        <label class="form-label">Area of Expertise</label>
                        <input type="text" name="expertise" placeholder="e.g., Legal Aid, Job Hunting" class="form-input" required>
                    </div>

                    <div>
                        <label class="form-label">Organization</label>
                        <input type="text" name="organization" placeholder="Organization name (if any)" class="form-input" required>
                    </div>

                    <div>
                        <label class="form-label">General Availability</label>
                        <input type="text" name="availability" placeholder="e.g., Weekends, Evenings" class="form-input">
                    </div>

                    <button type="submit" class="w-full bg-home-coral text-white font-black py-4 rounded-xl shadow-lg hover:bg-home-coral/90 hover:scale-105 active:scale-[0.98] transition-all uppercase tracking-widest mt-2">
                        Start Guiding
                    </button>
                </form>

                <div class="mt-8 pt-6 border-t border-gray-100 text-center">
                    <p class="text-sm text-gray-500">
                        Not a mentor? <a href="migrant_reg.html" class="link-teal">Register as Migrant</a>
                    </p>
                </div>
            </div>
        </div>
    </main>

    <script src="js/validation_input.js"></script>
    <script src="js/mentor_reg.js"></script>
</body>
</html>

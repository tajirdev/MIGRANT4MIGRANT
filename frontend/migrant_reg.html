<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Migrant Registration - MIGRANT4MIGRANT</title>
    <link href="style/output.css" rel="stylesheet">
</head>
<body class="bg-brand-dark min-h-screen overflow-auto">
    <main class="flex flex-col md:flex-row min-h-screen w-full">
        <div class="w-full md:w-[40%] bg-brand-red text-white p-8 md:p-14 flex flex-col justify-center text-center rounded-b-2xl md:rounded-bl-none md:rounded-r-2xl">
            <header>
                <h1 class="text-3xl md:text-4xl font-bold tracking-[4px] mb-2">MIGRANT 4 MIGRANT</h1>
                <p class="italic opacity-80 text-sm md:text-base">"Every migrant deserves a community — MIGRANT4MIGRANT makes it findable."</p>
            </header>
        </div>

        <div class="form-side w-full md:w-[60%] bg-brand-dark flex flex-col justify-center items-center p-8 md:p-10">
            <div class="w-full max-w-[420px]">
                <div class="text-center mb-8">
                    <h2 class="text-3xl font-bold text-brand-yellow mb-2">Join Our Community Today!</h2>
                    <p class="text-gray-400 text-sm">Connecting migrants with the resources and support they need to thrive.</p>
                    <p class="text-gray-400 text-sm">Register and find your community.</p>
                </div>

                <form id="migrantRegForm" class="space-y-4">
                    <div><label class="form-label">Full Name</label><input type="text" name="name" class="form-input" required></div>
                    <div class="grid grid-cols-2 gap-4">
                        <div><label class="form-label">Username</label><input type="text" name="user_name" class="form-input" required></div>
                        <div><label class="form-label">Email</label><input type="email" name="email" class="form-input" required></div>
                    </div>
                    <div><label class="form-label">Password</label><input type="password" name="password" class="form-input" required></div>
                    
                    <div class="grid grid-cols-2 gap-4">
                        <div><label class="form-label">Native Country</label><input list="country-list" name="native_country" class="form-input" required></div>
                        <div><label class="form-label">Current Country</label><input list="country-list" name="current_country" class="form-input" required></div>
                    </div>
                    <datalist id="country-list"></datalist>

                    <div><label class="form-label">Language</label><input type="text" name="language" class="form-input" required></div>

                    <button type="submit" class="btn-primary">Create Migrant Account</button>
                </form>
                <p class="mt-6 text-center text-gray-500 text-sm">Already a member? <a href="login.html" class="link-yellow">Login here</a></p>
            </div>
        </div>
    </main>
    <script src="js/validation_input.js"></script>
    <script src="js/migrant_reg.js"></script>
</body>
</html>

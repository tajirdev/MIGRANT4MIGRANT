<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Migrant Registration - MIGRANT4MIGRANT</title>
    <link rel="stylesheet" href="style/style.css">
</head>
<body>
    <main class="master-container">
        <div class="branding-side">
            <header>
                <h1>MIGRANT 4 MIGRANT</h1>
                <p class="motto">"Every migrant deserves a community — MIGRANT4MIGRANT makes it findable."</p>
            </header>

            <section class="welcome-text">
                <h2>Join Our Community</h2>
                <p>Connecting migrants with the resources and support they need to thrive.</p>
            </section>
        </div>

        <div class="form-side">
            <div class="form-container">
                <div class="form-header">
                    <h2>Join Us Now</h2>
                    <p>Register as a migrant and find your community</p>
                </div>

                <form id="migrantRegForm">
                    <div class="form-group">
                        <label for="name">Full Name</label>
                    <input type="text" id="name" name="name" required placeholder="Enter your full name">
                </div>

                <div class="form-group">
                    <label for="user_name">Username</label>
                    <input type="text" id="user_name" name="user_name" required placeholder="Choose a unique username">
                </div>

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" required placeholder="name@example.com">
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required placeholder="Create a strong password">
                </div>

                <div class="form-group">
                    <label for="native_country">Native Country</label>
                    <input type="text" id="native_country" name="native_country" required placeholder="Where are you originally from?">
                </div>

                <div class="form-group">
                    <label for="current_country">Current Country</label>
                    <input type="text" id="current_country" name="current_country" required placeholder="Where are you living now?">
                </div>

                <div class="form-group">
                    <label for="language">Primary Language</label>
                    <input type="text" id="language" name="language" required placeholder="e.g., Swahili, French, Arabic">
                </div>

                    <button type="submit" class="btn-primary">Create Migrant Account</button>
                </form>

                <p class="footer-link">Already a member? <a href="login.html">Login here</a></p>
            </div>
        </div>
    </main>

    <script src="js/migrant_reg.js"></script>
</body>
</html>
